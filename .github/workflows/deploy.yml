name: Deploy to Linode on push

on:
  push:
    branches:
      - staging        # change to whatever branch you want to auto-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (not strictly needed for SSH-only deploy, but harmless)
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SEMA_ID_RSA }}

      - name: Run deploy script on Linode
        run: |
          ssh -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_rsa \
                  ${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }} \
                  "/home/deploy/deploy_myapp.sh"
