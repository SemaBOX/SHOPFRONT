name: Deploy to Linode on push

on:
  push:
    branches:
      - staging        # change to whatever branch you want to auto-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env: 
      HOME: "~/"

    steps:
      - name: Setup SSH
      - run: |
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.LINODE_SSH_KEY }}" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          touch "$HOME/.ssh/known_hosts"
          ssh-keyscan -H "${{ secrets.LINODE_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Run deploy script on Linode
        run: |
          ssh -o StrictHostKeyChecking=yes -i ../private.key "${{ vars.LINODE_USER }}@${{ vars.LINODE_HOST }}" "/home/deploy/deploy_myapp.sh"
