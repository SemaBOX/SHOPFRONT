name: Deploy to Linode on push

on:
  push:
    branches:
      - staging        # change to whatever branch you want to auto-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout (not strictly needed for SSH-only deploy, but harmless)
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ Environments.SEMA_ID_RSA }}" > ../private.key
          sudo chmod 600 ../private.key
          echo "${{ Environments.LINODE_HOST }}" > ~/.ssh/known_hosts
        shell: bash

      - name: Run deploy script on Linode
        run: |
          ssh -o StrictHostKeyChecking=yes -i ../private.key "${{ Environments.LINODE_USER }}@${{ Environments.LINODE_HOST }}" "/home/deploy/deploy_myapp.sh"
